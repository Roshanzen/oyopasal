# ==============================================================================
# OyoPasal — Production Nginx Configuration
# Multi-Vendor E-Commerce SaaS Marketplace (Nepal)
# Upstreams: Gunicorn (WSGI HTTP) + Daphne (ASGI WebSockets)
# ==============================================================================

# Rate Limiting Zones (DDoS and brute-force mitigation)
limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_strict_limit:10m rate=5r/s;

# Upstream Backend WSGI (Gunicorn)
upstream django_backend {
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 32;
}

# Upstream Backend ASGI (Daphne/Channels WebSockets)
upstream daphne_websocket {
    server 127.0.0.1:8001;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server — Enforce Permanent HTTPS 301 Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name oyopasal.com www.oyopasal.com api.oyopasal.com vendor.oyopasal.com admin.oyopasal.com;

    # ACME Challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Production Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oyopasal.com www.oyopasal.com api.oyopasal.com vendor.oyopasal.com admin.oyopasal.com;

    # SSL / TLS Hardening
    ssl_certificate /etc/letsencrypt/live/oyopasal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oyopasal.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/oyopasal.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

    # Maximum file upload size (catalogue media & vendor KYC PDFs)
    client_max_body_size 25M;
    client_body_buffer_size 512k;
    client_header_timeout 30s;
    client_body_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Access and Error Logs
    access_log /var/log/nginx/oyopasal_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/oyopasal_error.log warn;

    # --------------------------------------------------------------------------
    # Frontend Single Page Application (React / Vite Dist)
    # --------------------------------------------------------------------------
    root /var/www/oyopasal/dist;
    index index.html;

    # Static Assets with Long-Term Immutable Caching (Hashed by Vite)
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|ico|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA Fallback for Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Django Backend Static & Media Files
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/oyopasal/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location /media/ {
        alias /var/www/oyopasal/backend/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Django REST API Endpoints
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general_limit burst=50 nodelay;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Strict Rate Limit for Auth Mutations (Prevent Credential Stuffing)
    location /api/v1/auth/ {
        limit_req zone=auth_strict_limit burst=10 nodelay;

        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Administration Dashboard
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # WebSocket Endpoints (Real-time Live Order Tracking & Concierge)
    # --------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://daphne_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
