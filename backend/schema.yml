      - id
      - municipality
      - province_display
      - recipient_name
      - recipient_phone
      - tole_street
      - updated_at
      - ward_number
    AddressRequest:
      type: object
      properties:
        recipient_name:
          type: string
          minLength: 1
          maxLength: 150
        recipient_phone:
          type: string
          minLength: 1
          maxLength: 20
        province:
          $ref: '#/components/schemas/ProvinceEnum'
        district:
          type: string
          minLength: 1
          maxLength: 100
        municipality:
          type: string
          minLength: 1
          description: Municipality, Metropolitan City, or Rural Municipality
          maxLength: 150
        ward_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Ward number (1-35)
        tole_street:
          type: string
          minLength: 1
          description: Tole or street name
          maxLength: 255
        landmark:
