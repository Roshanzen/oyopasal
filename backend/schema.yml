openapi: 3.0.3
info:
  title: Oyo Pasal - Multi-Vendor E-Commerce SaaS API
  version: 1.0.0
  description: Comprehensive, production-ready REST API for Customers, Vendors, Suppliers,
    and Super Admin ecosystems.
paths:
  /api/v1/admin/moderation/:
    get:
      operationId: admin_moderation_list
      description: List products pending administrator approval (SUBMITTED).
      summary: List Pending Products for Moderation (Admin)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
  /api/v1/admin/products/{id}/moderate/:
    post:
      operationId: admin_products_moderate_create
      description: Approve, Reject, or Suspend a product.
      summary: Moderate Product (Approve / Reject / Suspend)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductModerationActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductModerationActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductModerationActionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/ai/forecasting/demand/{variant_id}/:
    get:
      operationId: ai_forecasting_demand_retrieve
      description: Forecasts future SKU depletion rate and generates automated replenishment
        recommendation.
      summary: 'AI: Predictive Demand & Stockout Forecast'
      parameters:
      - in: query
        name: forecast_days
        schema:
          type: integer
        description: Target forecast period in days (default 30)
      - in: query
        name: lookback_days
        schema:
          type: integer
        description: Historical sample days (default 30)
      - in: path
        name: variant_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemandForecastResponse'
          description: ''
  /api/v1/ai/fraud/risk/{order_id}/:
    get:
      operationId: ai_fraud_risk_retrieve
      description: Analyzes order velocity, transaction value, and payment history
        to compute risk score (0-100).
      summary: 'AI: Order Fraud & Abuse Risk Evaluation'
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRiskEvaluationResponse'
          description: ''
  /api/v1/ai/recommendations/frequently-bought/{product_id}/:
    get:
      operationId: ai_recommendations_frequently_bought_list
      description: Calculates item co-occurrence affinity scores across historical
        suborders.
      summary: 'AI: Frequently Bought Together'
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FrequentlyBoughtTogetherItem'
          description: ''
  /api/v1/ai/recommendations/personalized/:
    get:
      operationId: ai_recommendations_personalized_list
      description: Suggests products matched to customer historical affinities.
      summary: 'AI: Personalized Feed Recommendations'
      tags:
      - ai
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalizedRecommendationItem'
          description: ''
  /api/v1/ai/recommendations/trending/:
    get:
      operationId: ai_recommendations_trending_list
      description: Calculates sales momentum over recent lookback window.
      summary: 'AI: Trending Catalog Items'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Window in days (default 7)
      - in: query
        name: limit
        schema:
          type: integer
        description: Number of items (default 8)
      tags:
      - ai
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrendingProductItem'
          description: ''
  /api/v1/analytics/admin/kpis/:
    get:
      operationId: analytics_admin_kpis_retrieve
      description: Returns consolidated business, sales, financial, and wholesale
        procurement KPIs.
      summary: 'Admin: Executive KPI Dashboard'
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDashboardResponse'
          description: ''
  /api/v1/analytics/admin/sales-trends/:
    get:
      operationId: analytics_admin_sales_trends_list
      description: Returns daily GMV, order volume, subtotal, and tax breakdowns over
        the requested window.
      summary: 'Admin: Sales Trends Timeseries'
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Number of days to look back (default 30)
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesTrendItem'
          description: ''
  /api/v1/analytics/admin/top-products/:
    get:
      operationId: analytics_admin_top_products_list
      description: Ranks best-selling catalog items across all stores by units sold.
      summary: 'Admin: Top Selling Products'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum number of products to return (default 10)
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopProductItem'
          description: ''
  /api/v1/analytics/admin/top-vendors/:
    get:
      operationId: analytics_admin_top_vendors_list
      description: Ranks top active merchants by gross sales, completed orders, and
        platform commission generated.
      summary: 'Admin: Top Performing Vendors'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum number of merchants to return (default 10)
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopVendorItem'
          description: ''
  /api/v1/audit/logs/:
    get:
      operationId: audit_logs_list
      description: Inspect immutable compliance logs of administrative actions, KYC
        updates, and financial operations.
      summary: 'Admin: List Audit Logs'
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - CREATE
          - DELETE
          - KYC_VERIFICATION
          - LOGIN
          - LOGOUT
          - PLAN_CHANGE
          - REFUND_DISBURSEMENT
          - SETTLEMENT_APPROVAL
          - SYSTEM_CONFIG
          - UPDATE
        description: |-
          * `LOGIN` - User Login
          * `LOGOUT` - User Logout
          * `CREATE` - Record Created
          * `UPDATE` - Record Updated
          * `DELETE` - Record Deleted
          * `KYC_VERIFICATION` - KYC Approved or Rejected
          * `SETTLEMENT_APPROVAL` - Vendor Settlement Approved
          * `REFUND_DISBURSEMENT` - Customer Refund Disbursed
          * `PLAN_CHANGE` - SaaS Plan Modified
          * `SYSTEM_CONFIG` - Platform Setting Modified
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: target_model
        schema:
          type: string
      tags:
      - audit
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate via email and password to receive JWT tokens with
        RBAC claims.
      summary: User Login (JWT Token Obtain)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist refresh token to securely terminate user session.
      summary: User Logout
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve active user profile, assigned roles, and organization
        references.
      summary: Current User Profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Update personal details (names, phone, avatar) of authenticated
        user.
      summary: Update Current User Profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserDetailRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/v1/auth/password-change/:
    post:
      operationId: auth_password_change_create
      description: Update account password with validation against previous password.
      summary: Change Password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Register a new Customer, Vendor Owner, or Supplier Owner account.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/brands/:
    get:
      operationId: brands_list
      description: List all active brands.
      summary: List Public Brands
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - brands
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBrandList'
          description: ''
  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      description: View, add to, or clear active customer cart.
      summary: Retrieve Customer Cart
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    post:
      operationId: cart_create
      description: View, add to, or clear active customer cart.
      summary: Add Product to Cart
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_destroy
      description: View, add to, or clear active customer cart.
      summary: Clear Cart
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/cart/items/{id}/:
    patch:
      operationId: cart_items_partial_update
      description: Update item quantity or remove item from cart.
      summary: Update Cart Item Quantity
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateCartItemRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
    delete:
      operationId: cart_items_destroy
      description: Update item quantity or remove item from cart.
      summary: Remove Item from Cart
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
          description: ''
  /api/v1/categories/:
    get:
      operationId: categories_list
      description: List root categories with their active subcategories.
      summary: List Public Category Hierarchy
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryTree'
          description: ''
  /api/v1/categories/{slug}/:
    get:
      operationId: categories_retrieve
      description: Retrieve category details with active subcategories.
      summary: Retrieve Category Details
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryTree'
          description: ''
  /api/v1/customers/addresses/:
    get:
      operationId: customers_addresses_list
      description: Customer address book management across Nepal administrative divisions.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: ''
    post:
      operationId: customers_addresses_create
      description: Customer address book management across Nepal administrative divisions.
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
  /api/v1/customers/addresses/{id}/:
    get:
      operationId: customers_addresses_retrieve
      description: Customer address book management across Nepal administrative divisions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this address.
        required: true
      tags:
      - customers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    put:
      operationId: customers_addresses_update
      description: Customer address book management across Nepal administrative divisions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this address.
        required: true
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    patch:
      operationId: customers_addresses_partial_update
      description: Customer address book management across Nepal administrative divisions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this address.
        required: true
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: customers_addresses_destroy
      description: Customer address book management across Nepal administrative divisions.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this address.
        required: true
      tags:
      - customers
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/customers/addresses/{id}/set-default/:
    post:
      operationId: customers_addresses_set_default_create
      description: Designates the target address as the default shipping or billing
        address.
      summary: 'Customer: Set Default Address'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this address.
        required: true
      tags:
      - customers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
