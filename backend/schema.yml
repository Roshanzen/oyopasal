          type: string
          maxLength: 20
        province:
          $ref: '#/components/schemas/ProvinceEnum'
        province_display:
          type: string
          readOnly: true
        district:
          type: string
          maxLength: 100
        municipality:
          type: string
          description: Municipality, Metropolitan City, or Rural Municipality
          maxLength: 150
        ward_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Ward number (1-35)
        tole_street:
          type: string
