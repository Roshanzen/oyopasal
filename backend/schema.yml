        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
  /api/v1/warehouses/{id}/:
    get:
      operationId: warehouses_retrieve
      description: Retrieve, update, or soft-delete warehouse facility.
      summary: Retrieve Warehouse Details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - warehouses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
    put:
      operationId: warehouses_update
      description: Retrieve, update, or soft-delete warehouse facility.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - warehouses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WarehouseRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
    patch:
      operationId: warehouses_partial_update
      description: Retrieve, update, or soft-delete warehouse facility.
      summary: Update Warehouse Details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - warehouses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWarehouseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWarehouseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWarehouseRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Warehouse'
          description: ''
    delete:
      operationId: warehouses_destroy
      description: Retrieve, update, or soft-delete warehouse facility.
      summary: Delete Warehouse
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - warehouses
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
