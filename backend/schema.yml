        * `SHIPPED` - Shipped
        * `OUT_FOR_DELIVERY` - Out for Delivery
        * `DELIVERED` - Delivered
        * `CANCELLATION_REQUESTED` - Cancellation Requested
        * `CANCELLED` - Cancelled
        * `RETURN_REQUESTED` - Return Requested
        * `RETURNED` - Returned
        * `REFUND_PENDING` - Refund Pending
        * `REFUNDED` - Refunded
        * `FAILED` - Failed
